  <!-- In-Browser React Application Runner -->
  <script type="text/babel">
    const { useState, useEffect } = React;

      const navItems = [

        { id: 'history', label: 'History', icon: '🕒' },
        { id: 'emergency', label: 'Emergency', icon: '🚨' },
        { id: 'about', label: 'About', icon: 'ℹ️' },
        { id: 'contact', label: 'Contact', icon: '📞' }

      return (
        <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex items-center justify-between h-16">
              <div className="flex items-center space-x-3 cursor-pointer select-none" onClick={() => setActivePage('home')}>
                <div className="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center text-white text-xl shadow-md shadow-emerald-500/20">
                  🐾
                </div>
                <div>
                  <div className="flex items-center space-x-1.5">
                    <span className="text-lg font-black tracking-tight text-slate-900">VetScan</span>
                    <span className="bg-emerald-100 text-emerald-800 text-[10px] font-extrabold px-1.5 py-0.5 rounded tracking-wider uppercase">React AI</span>
                  </div>
                  <p className="text-[11px] text-slate-500 font-medium">Veterinary Disease Detection & Triage</p>
                </div>
              </div>

              <nav className="hidden xl:flex items-center space-x-1">
                {navItems.map(item => (
                  <button
                    key={item.id}
                    onClick={() => setActivePage(item.id)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 ${
                      activePage === item.id 
                        ? 'bg-emerald-600 text-white shadow-sm' 
                        : item.id === 'emergency'
                        ? 'text-red-700 hover:bg-red-50'
                        : 'text-slate-600 hover:bg-slate-100'

                  >
                    <span>{item.icon}</span>
                    <span>{item.label}</span>
                  </button>
                ))}
              </nav>

              <div className="hidden sm:flex items-center space-x-2.5">
                <button
                  onClick={() => setActivePage('emergency')}

                >
                  <span className="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
                  24/7 SOS
                </button>

                {user ? (
                  <div className="flex items-center space-x-2 pl-2 border-l border-slate-200">
                    <span className="text-xs font-semibold text-slate-700">{user.name}</span>
                    <button
                      onClick={() => setUser(null)}

                    >
                      Logout
                    </button>
                  </div>
                ) : (
                  <div className="flex items-center space-x-2">
                    <button onClick={() => setActivePage('login')} className="px-3 py-1.5 rounded-lg text-xs font-bold text-slate-700 hover:bg-slate-100">

              <div className="flex xl:hidden">
                <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="p-2 rounded-lg text-slate-600 hover:bg-slate-100">
                  <span className="text-xl">{mobileMenuOpen ? '✕' : '☰'}</span>
                </button>
              </div>
            </div>

            {mobileMenuOpen && (
              <div className="xl:hidden py-3 border-t border-slate-100 grid grid-cols-2 sm:grid-cols-3 gap-1.5 pb-4">
                {navItems.map(item => (

    // --- Component: Footer ---
    function Footer({ setActivePage }) {

        <footer className="bg-slate-900 text-slate-400 text-xs py-10 border-t border-slate-800 mt-16">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8">
            <div className="grid grid-cols-1 md:grid-cols-4 gap-8">
              <div className="space-y-3 md:col-span-2">
                <div className="flex items-center space-x-2 text-white font-bold text-base">
                  <span className="w-7 h-7 bg-emerald-600 rounded-lg flex items-center justify-center text-sm">🐾</span>
                  <span>VetScan AI Platform</span>
                </div>
                <p className="text-slate-400 text-xs leading-relaxed max-w-md">
                  Intelligent veterinary clinical decision-support suite powered by machine learning, multi-species differential disease classification, and instant emergency triage protocols.
                </p>
                <div className="flex items-center space-x-3 text-slate-300 text-xs pt-1">

              <div className="space-y-2">
                <h4 className="text-white font-bold uppercase tracking-wider text-xs">Diagnostic Suite</h4>
                <ul className="space-y-1.5 text-xs">

                  <li><button onClick={() => setActivePage('about')} className="hover:text-emerald-400">About Our AI Models</button></li>
                  <li><button onClick={() => setActivePage('contact')} className="hover:text-emerald-400">Contact Support</button></li>

                </ul>
              </div>
            </div>

            <div className="pt-6 border-t border-slate-800 text-[11px] text-slate-400 leading-relaxed bg-slate-950/50 p-4 rounded-xl">
              <strong className="text-slate-200">VETERINARY MEDICAL DISCLAIMER:</strong> VetScan AI is designed for educational, research, and diagnostic support. Always transport emergency cases to a licensed veterinarian.
            </div>

            <div className="flex flex-col sm:flex-row items-center justify-between text-[11px] text-slate-400 pt-2 gap-2">
              <p>© 2026 VetScan AI Technologies Inc. All rights reserved.</p>
              <div className="flex space-x-4">
                <button onClick={() => setActivePage('about')} className="hover:text-slate-300">Privacy Policy</button>
                <button onClick={() => setActivePage('about')} className="hover:text-slate-300">Terms of Use</button>
              </div>
            </div>
          </div>
        </footer>
      );
    }

    // --- Component: AnimalCard ---
    function AnimalCard({ animal, isSelected, onSelect, onLearnMore }) {
      return (
        <div 
          className={`rounded-2xl border-2 p-5 transition-all duration-200 cursor-pointer flex flex-col justify-between ${
            isSelected 
              ? 'border-emerald-600 bg-emerald-50/70 shadow-md ring-2 ring-emerald-400/20' 
              : 'border-slate-200 bg-white hover:border-emerald-300 hover:shadow-sm'
          }`}
          onClick={() => onSelect && onSelect(animal.id)}
        >
          <div>
            <div className="flex items-center justify-between mb-3">
              <div className="text-4xl p-2 bg-slate-100 rounded-xl inline-block">{animal.icon}</div>
              <span className="text-[10px] uppercase font-extrabold px-2.5 py-1 rounded-full bg-slate-100 text-slate-700">
                {animal.category}
              </span>
            </div>
            <h3 className="text-base font-bold text-slate-900 mb-1">{animal.name}</h3>
            <p className="text-xs text-slate-500 mb-3 line-clamp-2">{animal.desc}</p>
          </div>

          <div className="pt-3 border-t border-slate-100 flex items-center justify-between">
            <span className="text-xs font-bold text-emerald-600">
              {isSelected ? '✓ Selected' : 'Select Species'}
            </span>
            {onLearnMore && (
              <button
                type="button"
                onClick={(e) => { e.stopPropagation(); onLearnMore(animal.id); }}
                className="text-[11px] font-semibold text-slate-500 hover:text-slate-900 hover:underline"
              >
                Vitals Guide →
              </button>
            )}
          </div>
        </div>
      );
    }

    // --- Component: PredictionCard ---
    function PredictionCard({ prediction, rank, onOpenDetails, onBookVet }) {
      const badgeColor = prediction.urgencyLevel === 'CRITICAL'
        ? 'bg-red-100 text-red-800 border-red-200'
        : prediction.urgencyLevel === 'URGENT'
        ? 'bg-amber-100 text-amber-800 border-amber-200'
        : 'bg-emerald-100 text-emerald-800 border-emerald-200';

      const progressColor = prediction.confidence > 75 ? 'bg-red-500' : prediction.confidence > 50 ? 'bg-amber-500' : 'bg-emerald-500';

      return (
        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 hover:border-emerald-300 transition-all">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-3">
            <div>
              <div className="flex items-center space-x-2 flex-wrap gap-1">
                {rank && <span className="text-xs font-black text-slate-400">#{rank}</span>}
                <h4 className="text-base font-bold text-slate-900">{prediction.name}</h4>
                <span className={`text-[10px] font-bold px-2 py-0.5 rounded border uppercase ${badgeColor}`}>
                  {prediction.urgencyLevel}
                </span>
                {prediction.zoonotic && (
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-purple-100 text-purple-800 border border-purple-200">
                    ☣️ Zoonotic Risk
                  </span>
                )}
              </div>
              <p className="text-xs text-slate-500 mt-0.5">{prediction.pathogenType} • Incubation: {prediction.incubationPeriod}</p>
            </div>

            <div className="text-right sm:min-w-[130px]">
              <div className="flex items-center justify-end space-x-1.5">
                <span className="text-xs text-slate-400 font-semibold">Confidence:</span>
                <span className="text-base font-black text-slate-900">{prediction.confidence}%</span>
              </div>
              <div className="w-full bg-slate-100 h-2 rounded-full mt-1 overflow-hidden">
                <div className={`${progressColor} h-full rounded-full transition-all duration-500`} style={{ width: `${prediction.confidence}%` }}></div>
              </div>
            </div>
          </div>

          <p className="text-xs sm:text-sm text-slate-700 mb-4 leading-relaxed">{prediction.description}</p>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4 bg-slate-50 p-3.5 rounded-xl border border-slate-100 text-xs">
            <div>
              <span className="font-bold text-slate-800 block mb-1">
                Matched Clinical Signs ({prediction.matchedSymptoms ? prediction.matchedSymptoms.length : 0}):
              </span>
              <div className="flex flex-wrap gap-1">
                {prediction.matchedSymptoms && prediction.matchedSymptoms.length > 0 ? (
                  prediction.matchedSymptoms.map((s, idx) => (
                    <span key={idx} className="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-medium text-[11px]">
                      ✓ {s.replace(/_/g, ' ')}
                    </span>
                  ))
                ) : (
                  <span className="text-slate-400 italic">No direct symptom tags</span>
                )}
              </div>
            </div>
            <div>
              <span className="font-bold text-slate-800 block mb-1">Recommended Lab Tests:</span>
              <p className="text-slate-600 text-[11px]">
                {Array.isArray(prediction.clinicalDiagnostics) 
                  ? prediction.clinicalDiagnostics.slice(0, 2).join('; ') 
                  : prediction.recommendedTest || 'Complete CBC & Cytology'}
              </p>
            </div>
          </div>

          <div className="flex flex-wrap items-center justify-between gap-3 pt-3 border-t border-slate-100">
            <button
              onClick={() => onOpenDetails && onOpenDetails(prediction)}
              className="text-xs font-bold text-emerald-600 hover:text-emerald-800 hover:underline flex items-center gap-1"
            >
              View Full Clinical Treatment Protocol →
            </button>
            {onBookVet && (
              <button
                onClick={() => onBookVet(prediction)}
                className="text-xs font-bold bg-slate-900 hover:bg-slate-800 text-white px-3.5 py-1.5 rounded-lg transition-colors"
              >
                Schedule Vet Exam
              </button>
            )}
          </div>
        </div>
      );
    }

    // --- Main Application Root ---
    function VetScanApp() {
      const initialData = {
        speciesList: typeof SPECIES_CONFIG !== 'undefined' ? SPECIES_CONFIG.map(s => ({
          ...s,
          vitals: typeof NORMAL_VITALS !== 'undefined' ? NORMAL_VITALS.find(v => v.species.toLowerCase().includes(s.id === 'cattle' ? 'bovine' : s.id === 'sheep_goat' ? 'goat' : s.id)) || { temp: '38.5 °C', heartRate: '70-120 bpm', respRate: '15-30 bpm', crt: '< 2s' } : {}
        })) : [],
        symptomCategories: typeof SYMPTOM_CATEGORIES !== 'undefined' ? SYMPTOM_CATEGORIES : [],
        diseasesDatabase: typeof DISEASES_DATABASE !== 'undefined' ? DISEASES_DATABASE : [],
        scannerPresets: typeof IMAGE_SCAN_PRESETS !== 'undefined' ? IMAGE_SCAN_PRESETS : [],
        normalVitals: typeof NORMAL_VITALS !== 'undefined' ? NORMAL_VITALS : [],
        toxicityAlerts: typeof TOXICITY_ALERTS !== 'undefined' ? TOXICITY_ALERTS : []
      };

      const [activePage, setActivePage] = useState('home');
      const [user, setUser] = useState({ name: 'Dr. Sarah Jenkins', email: 'sarah.j@vetscan.org', role: 'veterinarian' });
      const [selectedSpecies, setSelectedSpecies] = useState('dog');
      const [selectedDiseaseModal, setSelectedDiseaseModal] = useState(null);

      // Default sample result for demo
      const [activeResult, setActiveResult] = useState({
        patient: { name: 'Buddy', species: 'dog', breed: 'Golden Retriever', age: '2 years', weight: '28 kg', vaccineStatus: 'up_to_date', duration: '1-3 Days' },
        symptoms: ['fever', 'vomiting', 'bloody_diarrhea', 'lethargy'],
        evaluatedAt: new Date().toLocaleTimeString(),
        triageStatus: {
          level: 'RED',
          title: 'CRITICAL EMERGENCY - IMMEDIATE VET CARE',
          message: 'Potentially life-threatening conditions or acute clinical distress detected. Do not delay. Transport patient immediately to an emergency veterinary hospital.',
          hasRedFlags: true,
          redFlagList: ['BLOODY DIARRHEA', 'VOMITING', 'FEVER']
        },
        topMatches: [
          {
            id: 'canine_parvovirus',
            name: 'Canine Parvovirus (CPV-2)',
            confidence: 96,
            urgencyLevel: 'CRITICAL',
            pathogenType: 'Viral (Parvoviridae)',
            incubationPeriod: '3 - 7 days',
            description: 'A life-threatening viral disease attacking rapidly dividing cells in intestinal crypts, bone marrow, and myocardium, leading to severe hemorrhagic gastroenteritis and septic shock.',
            clinicalDiagnostics: ['Fecal Parvo SNAP Antigen ELISA', 'Complete Blood Count (CBC showing severe Leukopenia)'],
            matchedSymptoms: ['bloody_diarrhea', 'vomiting', 'lethargy', 'fever']
          }
        ]
      });

      const [historyList, setHistoryList] = useState([
        {
          id: 'hist_1',
          date: 'Aug 24, 2026, 04:30 PM',
          patientName: 'Buddy',
          species: 'Canine (Dog)',
          breed: 'Golden Retriever',
          topDisease: 'Canine Parvovirus (CPV-2)',
          confidence: 96,
          urgency: 'CRITICAL',
          triageLevel: 'RED',
          symptoms: ['bloody_diarrhea', 'vomiting', 'fever', 'lethargy']
        },
        {
          id: 'hist_2',
          date: 'Aug 23, 2026, 11:15 AM',
          patientName: 'Misty',
          species: 'Feline (Cat)',
          breed: 'Persian',
          topDisease: 'Dermatophytosis (Ringworm)',
          confidence: 91,
          urgency: 'MODERATE',
          triageLevel: 'AMBER',
          symptoms: ['alopecia', 'crusting_scabs', 'severe_itching']
        }
      ]);

      const handleRunPrediction = ({ patient, symptoms, scannerOverride }) => {
        const currentSpecies = patient.species || selectedSpecies;

        if (scannerOverride) {
          const scanResultObj = {
            patient,
            symptoms,
            scannerOverride,
            evaluatedAt: new Date().toLocaleTimeString(),
            triageStatus: {
              level: scannerOverride.severity.includes('URGENT') || scannerOverride.severity.includes('CRITICAL') ? 'AMBER' : 'GREEN',
              title: scannerOverride.severity,
              message: scannerOverride.actionPlan,
              hasRedFlags: false,
              redFlagList: []
            },
            topMatches: [
              {
                id: scannerOverride.id,
                name: scannerOverride.detectedDisease,
                confidence: scannerOverride.confidence,
                urgencyLevel: scannerOverride.severity.includes('CRITICAL') ? 'CRITICAL' : 'URGENT',
                pathogenType: 'Visual Lesion Scan Match',
                incubationPeriod: 'N/A (Cutaneous Presentation)',
                description: scannerOverride.lesionType,
                clinicalDiagnostics: [scannerOverride.recommendedTest],
                matchedSymptoms: symptoms,
                zoonotic: scannerOverride.severity.includes('ZOONOTIC')
              }
            ]
          };

          setActiveResult(scanResultObj);
          setHistoryList([{
            id: `hist_${Date.now()}`,
            date: new Date().toLocaleString(),
            patientName: patient.name || 'Patient',
            species: patient.species?.toUpperCase(),
            breed: patient.breed,
            topDisease: scannerOverride.detectedDisease,
            confidence: scannerOverride.confidence,
            urgency: 'URGENT',
            triageLevel: 'AMBER',
            symptoms
          }, ...historyList]);
          return;
        }

        // Calculation
        const relevant = initialData.diseasesDatabase.filter(d => d.species.includes(currentSpecies) || d.species.includes('all'));
        const matches = relevant.map(disease => {
          const totalKey = disease.keySymptoms.length;
          const matched = disease.keySymptoms.filter(s => symptoms.includes(s));
          const missing = disease.keySymptoms.filter(s => !symptoms.includes(s));
          const matchCount = matched.length;
          const matchRatio = totalKey > 0 ? matchCount / totalKey : 0;
          let confidence = symptoms.length > 0 && matchCount > 0 ? Math.min(98, Math.round(matchRatio * 70 + Math.min(matchCount, 4) * 7)) : 0;
          return { ...disease, matchCount, totalKey, matchedSymptoms: matched, missingSymptoms: missing, confidence };
        });

        matches.sort((a, b) => b.confidence - a.confidence);
        const topMatches = matches.filter(m => m.confidence > 15);

        const criticalSymptoms = ['collapse', 'bloody_vomit', 'bloody_diarrhea', 'bloat_distension', 'dyspnea', 'cyanosis', 'anuria', 'seizures'];
        const activeCritical = symptoms.filter(s => criticalSymptoms.includes(s));

        let triageStatus = {
          level: 'GREEN',
          title: 'Routine Care / Mild Urgency',
          message: 'No immediate red-flag indicators detected. Continue monitoring vitals.',
          hasRedFlags: false,
          redFlagList: []
        };

        if (activeCritical.length > 0 || (topMatches[0] && topMatches[0].urgencyLevel === 'CRITICAL' && topMatches[0].confidence >= 50)) {
          triageStatus = {
            level: 'RED',
            title: 'CRITICAL EMERGENCY - IMMEDIATE VET CARE',
            message: 'Potentially life-threatening conditions or acute clinical distress detected. Transport immediately to an emergency veterinary hospital.',
            hasRedFlags: true,
            redFlagList: activeCritical.map(c => c.replace(/_/g, ' ').toUpperCase())
          };
        } else if (symptoms.length >= 3 || (topMatches[0] && topMatches[0].confidence >= 40)) {
          triageStatus = {
            level: 'AMBER',
            title: 'URGENT - VET VISIT WITHIN 24 HOURS',
            message: 'Active symptoms indicate an acute condition. Schedule a veterinary examination today.',
            hasRedFlags: false,
            redFlagList: []
          };
        }

        const newResult = {
          patient,
          symptoms,
          topMatches: topMatches.length > 0 ? topMatches : relevant.slice(0, 3).map(r => ({ ...r, confidence: 25, matchedSymptoms: [] })),
          triageStatus,
          evaluatedAt: new Date().toLocaleTimeString()
        };

        setActiveResult(newResult);
        const topD = newResult.topMatches[0] || { name: 'Malaise', confidence: 50, urgencyLevel: 'MODERATE' };
        setHistoryList([{
          id: `hist_${Date.now()}`,
          date: new Date().toLocaleString(),
          patientName: patient.name,
          species: patient.species?.toUpperCase(),
          breed: patient.breed,
          topDisease: topD.name,
          confidence: topD.confidence,
          urgency: topD.urgencyLevel,
          triageLevel: triageStatus.level,
          symptoms
        }, ...historyList]);
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800">
          <Navbar activePage={activePage} setActivePage={setActivePage} user={user} setUser={setUser} />
          
          <main className="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {activePage === 'home' && (
              <div className="space-y-12">
                <section className="bg-gradient-to-br from-emerald-950 via-teal-900 to-slate-950 rounded-3xl p-8 sm:p-12 text-white shadow-2xl relative overflow-hidden">
                  <div className="relative z-10 max-w-3xl space-y-5">
                    <div className="inline-flex items-center gap-2 bg-emerald-500/20 text-emerald-300 text-xs font-black uppercase px-3.5 py-1.5 rounded-full border border-emerald-400/30">
                      <span>🐾 Next-Gen Veterinary Diagnostics AI</span>
                    </div>
                    <h1 className="text-3xl sm:text-5xl font-black tracking-tight leading-tight">
                      Instant Disease Prediction & Triage for Every Animal.
                    </h1>
                    <p className="text-slate-300 text-sm sm:text-base leading-relaxed max-w-2xl">
                      Detect early clinical signs, run computer-vision skin lesion scans, calculate emergency triage scores, and receive instant differential diagnosis protocols across 8 species.
                    </p>
                    <div className="flex flex-wrap items-center gap-3 pt-2">
                      <button onClick={() => setActivePage('prediction')} className="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black text-sm px-6 py-3.5 rounded-xl shadow-lg transition-all flex items-center gap-2">
                        <span>🩺 Start Disease Prediction</span>
                        <span>→</span>
                      </button>
                      <button onClick={() => setActivePage('emergency')} className="bg-red-600/90 hover:bg-red-600 text-white font-bold text-sm px-5 py-3.5 rounded-xl border border-red-500/50 transition-all flex items-center gap-2">
                        <span className="w-2.5 h-2.5 rounded-full bg-white animate-ping"></span>
                        <span>24/7 Emergency Triage</span>
                      </button>
                    </div>
                  </div>
                </section>

                {/* Quick Species Cards */}
                <section className="space-y-4">
                  <h2 className="text-xl font-bold text-slate-900">Supported Animal Categories</h2>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    {initialData.speciesList.slice(0, 4).map(sp => (
                      <AnimalCard
                        key={sp.id}
                        animal={sp}
                        onSelect={(id) => { setSelectedSpecies(id); setActivePage('prediction'); }}
                        onLearnMore={() => { setSelectedSpecies(sp.id); setActivePage('animal-info'); }}
                      />
                    ))}
                  </div>
                </section>
              </div>
            )}

            {activePage === 'login' && (
              <div className="max-w-md mx-auto my-8 bg-white p-8 rounded-3xl border border-slate-200 shadow-xl space-y-6">
                <div className="text-center space-y-2">
                  <div className="w-12 h-12 bg-emerald-600 rounded-2xl text-white text-2xl flex items-center justify-center mx-auto">🐾</div>
                  <h2 className="text-2xl font-black text-slate-900">Welcome Back</h2>
                  <p className="text-xs text-slate-500">Access your patient diagnostic portal</p>
                </div>
                <button onClick={() => { setUser({ name: 'Dr. Sarah Jenkins', email: 'sarah.j@vetscan.org', role: 'veterinarian' }); setActivePage('dashboard'); }} className="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl">
                  Sign In to Dashboard
                </button>
              </div>
            )}

            {activePage === 'signup' && (
              <div className="max-w-md mx-auto my-8 bg-white p-8 rounded-3xl border border-slate-200 shadow-xl space-y-6">
                <div className="text-center space-y-2">
                  <div className="w-12 h-12 bg-emerald-600 rounded-2xl text-white text-2xl flex items-center justify-center mx-auto">🐾</div>
                  <h2 className="text-2xl font-black text-slate-900">Create Account</h2>
                  <p className="text-xs text-slate-500">Join the veterinary AI diagnostic network</p>
                </div>
                <button onClick={() => { setUser({ name: 'Dr. Anjan Sharma', email: 'anjan@vetscan.org', role: 'owner' }); setActivePage('dashboard'); }} className="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl">
                  Complete Registration
                </button>
              </div>
            )}

            {activePage === 'dashboard' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center bg-white p-6 rounded-3xl border border-slate-200">
                  <div>
                    <h1 className="text-2xl font-black">Welcome, {user?.name || 'Veterinary Clinician'}</h1>
                    <p className="text-xs text-slate-500">Monitoring {historyList.length} recent diagnostic cases</p>
                  </div>
                  <button onClick={() => setActivePage('prediction')} className="bg-emerald-600 text-white font-bold text-xs px-4 py-2 rounded-xl">
                    + New Scan
                  </button>
                </div>
                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="bg-white p-5 rounded-2xl border border-slate-200"><span className="text-2xl font-black text-emerald-600">8</span><p className="text-xs text-slate-400">Species Monitored</p></div>
                  <div className="bg-white p-5 rounded-2xl border border-slate-200"><span className="text-2xl font-black text-blue-600">{historyList.length}</span><p className="text-xs text-slate-400">Evaluations</p></div>
                  <div className="bg-white p-5 rounded-2xl border border-slate-200"><span className="text-2xl font-black text-red-600">1</span><p className="text-xs text-slate-400">Critical Cases</p></div>
                  <div className="bg-white p-5 rounded-2xl border border-slate-200"><span className="text-2xl font-black text-purple-600">96.8%</span><p className="text-xs text-slate-400">Model Accuracy</p></div>
                </div>
              </div>
            )}

            {activePage === 'animal-info' && (
              <div className="space-y-6">
                <div className="bg-white p-6 rounded-3xl border border-slate-200">
                  <h1 className="text-2xl font-black">Species Vitals & Anatomy</h1>
                  <p className="text-xs text-slate-500">Baseline normal parameters for companion animals and livestock</p>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                  {initialData.speciesList.map(sp => (
                    <div key={sp.id} className="bg-white p-5 rounded-2xl border border-slate-200 space-y-2">
                      <div className="text-3xl">{sp.icon}</div>
                      <h3 className="font-bold text-slate-900">{sp.name}</h3>
                      <p className="text-xs text-emerald-700 font-semibold">Normal Temp: {sp.vitals?.temp || '38.5 °C'}</p>
                      <p className="text-xs text-slate-500">Heart Rate: {sp.vitals?.heartRate || '70-120 bpm'}</p>
                      <button onClick={() => { setSelectedSpecies(sp.id); setActivePage('prediction'); }} className="text-xs font-bold text-emerald-600 pt-2 block hover:underline">
                        Predict Symptoms →
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activePage === 'prediction' && (
              <div className="space-y-6">
                <div className="bg-white p-6 rounded-3xl border border-slate-200">

                  <p className="text-xs text-slate-500">Select symptoms or click presets below</p>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                  {initialData.scannerPresets.map(preset => (
                    <button
                      key={preset.id}
                      onClick={() => {
                        handleRunPrediction({
                          patient: { name: 'Demo Patient', species: preset.species.toLowerCase().includes('dog') ? 'dog' : 'cat', breed: 'Clinical Sample', age: '3 yrs', weight: '20 kg' },
                          symptoms: ['skin_nodules', 'erythema_hotspots'],
                          scannerOverride: preset
                        });
                        setActivePage('result');
                      }}
                      className="p-3 rounded-2xl border border-slate-200 bg-white hover:border-emerald-500 text-left"
                    >
                      <img src={preset.thumbnail} alt={preset.title} className="w-full h-20 object-cover rounded-lg mb-2" />
                      <span className="text-xs font-bold block">{preset.title}</span>
                      <span className="text-[10px] text-slate-400">{preset.species}</span>
                    </button>
                  ))}
                </div>

                <div className="bg-white p-6 rounded-3xl border border-slate-200 space-y-4">
                  <h3 className="font-bold text-sm">Select Symptoms to Analyze:</h3>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-2 text-xs">
                    {initialData.symptomCategories.flatMap(c => c.symptoms).slice(0, 12).map(sym => (
                      <button
                        key={sym.id}
                        onClick={() => {
                          handleRunPrediction({
                            patient: { name: 'Buddy', species: selectedSpecies, breed: 'Retriever', age: '2 yrs', weight: '28 kg' },
                            symptoms: [sym.id, 'fever', 'lethargy']
                          });
                          setActivePage('result');
                        }}
                        className="p-3 rounded-xl border border-slate-200 hover:bg-emerald-50 text-left flex justify-between"
                      >
                        <span>{sym.name}</span>
                        <span className="text-emerald-600 font-bold">Select →</span>
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {activePage === 'result' && (
              <div className="space-y-6">
                <div className="bg-white p-6 rounded-3xl border border-slate-200 flex justify-between items-center">
                  <div>
                    <h1 className="text-2xl font-black">Differential Diagnosis Result</h1>
                    <p className="text-xs text-slate-500">Patient: {activeResult?.patient?.name} ({activeResult?.patient?.species})</p>
                  </div>
                  <button onClick={() => window.print()} className="bg-slate-900 text-white text-xs font-bold px-4 py-2 rounded-xl">
                    📄 Print Report
                  </button>
                </div>

                <div className={`p-6 rounded-3xl border-2 ${activeResult?.triageStatus?.level === 'RED' ? 'bg-red-50 border-red-300' : 'bg-emerald-50 border-emerald-300'}`}>
                  <h2 className="text-lg font-black text-slate-900">● {activeResult?.triageStatus?.level} TRIAGE: {activeResult?.triageStatus?.title}</h2>
                  <p className="text-xs text-slate-700 mt-2">{activeResult?.triageStatus?.message}</p>
                </div>

                <div className="space-y-4">
                  {activeResult?.topMatches?.map((d, i) => (
                    <PredictionCard
                      key={i}
                      prediction={d}
                      rank={i + 1}
                      onOpenDetails={() => setSelectedDiseaseModal(d)}
                      onBookVet={() => setActivePage('emergency')}
                    />
                  ))}
                </div>
              </div>
            )}

            {activePage === 'disease-info' && (
              <div className="space-y-6">
                <div className="bg-white p-6 rounded-3xl border border-slate-200">
                  <h1 className="text-2xl font-black">Veterinary Disease Encyclopedia</h1>
                  <p className="text-xs text-slate-500">Complete clinical protocols and pathogen classifications</p>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {initialData.diseasesDatabase.map(d => (
                    <div key={d.id} className="bg-white p-5 rounded-2xl border border-slate-200 space-y-2">
                      <span className="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-slate-100">{d.urgencyLevel}</span>
                      <h3 className="font-bold text-slate-900">{d.name}</h3>
                      <p className="text-xs text-slate-500 line-clamp-2">{d.description}</p>
                      <button onClick={() => setSelectedDiseaseModal(d)} className="text-xs font-bold text-emerald-600 hover:underline pt-2 block">
                        Full Clinical Profile →
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activePage === 'history' && (
              <div className="space-y-6">
                <div className="bg-white p-6 rounded-3xl border border-slate-200">
                  <h1 className="text-2xl font-black">Diagnostic History</h1>
                  <p className="text-xs text-slate-500">Archived cases and evaluated triage records</p>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {historyList.map(h => (
                    <div key={h.id} className="bg-white p-5 rounded-2xl border border-slate-200 space-y-1">
                      <div className="flex justify-between font-bold text-sm">
                        <span>{h.patientName} ({h.species})</span>
                        <span className="text-emerald-700">{h.confidence}%</span>
                      </div>
                      <p className="text-xs text-slate-600">{h.topDisease}</p>
                      <span className="text-[11px] text-slate-400">{h.date}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activePage === 'emergency' && (
              <div className="space-y-6">
                <div className="bg-red-950 text-white p-8 rounded-3xl space-y-3">
                  <h1 className="text-3xl font-black">24/7 Emergency Veterinary SOS</h1>
                  <p className="text-xs text-red-200">Immediate transport protocols for acute trauma, bloat, and poisoning</p>
                  <a href="tel:1800555911" className="inline-block bg-red-600 font-bold px-6 py-3 rounded-xl text-sm mt-2">
                    📞 Call Emergency Dispatch: 1-800-555-VET
                  </a>
                </div>
              </div>
            )}

            {activePage === 'about' && (
              <div className="bg-white p-8 rounded-3xl border border-slate-200 space-y-4">
                <h1 className="text-3xl font-black">About VetScan AI</h1>
                <p className="text-xs text-slate-600 leading-relaxed">
                  Developed to accelerate veterinary triage, prevent livestock herd outbreaks, and empower pet owners with verified clinical insights.
                </p>
              </div>
            )}

            {activePage === 'contact' && (
              <div className="bg-white p-8 rounded-3xl border border-slate-200 space-y-4 max-w-xl mx-auto text-center">
                <h1 className="text-2xl font-black">Contact Veterinary Support</h1>
                <p className="text-xs text-slate-500">Email us at support@vetscan-ai.org or call 1-800-555-VET</p>
              </div>
            )}
          </main>

          {/* Modal */}
          {selectedDiseaseModal && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-start">
                  <h2 className="text-xl font-bold">{selectedDiseaseModal.name}</h2>
                  <button onClick={() => setSelectedDiseaseModal(null)} className="text-xl font-bold">✕</button>
                </div>
                <p className="text-xs text-slate-600">{selectedDiseaseModal.description}</p>
                <div className="bg-emerald-50 p-3 rounded-xl text-xs text-emerald-950">
                  <strong>Treatment:</strong> {selectedDiseaseModal.treatmentProtocol || 'Supportive fluid therapy & antibiotic coverage.'}
                </div>
                <button onClick={() => setSelectedDiseaseModal(null)} className="w-full bg-slate-900 text-white font-bold py-2 rounded-xl text-xs">
                  Close
                </button>
              </div>
            </div>
          )}

          <Footer setActivePage={setActivePage} />
        </div>
      );
    }

    // Render React Root
    const rootEl = document.getElementById('root');
    if (rootEl) {
      const root = ReactDOM.createRoot(rootEl);
      root.render(<VetScanApp />);
    }
  </script>
</body>
</html>
